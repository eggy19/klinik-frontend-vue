server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # DNS internal Docker. Upstream lewat variabel supaya Nginx tetap bisa start
    # walaupun container gateway belum siap, dan IP gateway di-resolve ulang
    # setelah gateway di-recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:3000;

    # Semua API: /api/v1/... diteruskan apa adanya (tanpa strip prefix)
    # karena gateway memakai global prefix 'api/v1'.
    location /api/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Asset hasil Vite punya hash di nama file — aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache agar deploy baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback untuk route Vue Router (mis. /inventory/master-data/obat).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
